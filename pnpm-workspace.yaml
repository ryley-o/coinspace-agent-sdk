packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  unrs-resolver: true
# Nextra <= 4.6.1 breaks under zod 4.4.x+ (a Zod behavior change around required-key validation
# order) -- see nextra#4989. Pinned until Nextra ships a fix/compatible range.
overrides:
  zod: 4.3.6
minimumReleaseAgeExclude:
  - '@next/env@15.5.25 || 16.3.4'
  - '@next/eslint-plugin-next@15.5.25 || 16.3.4'
  - '@next/swc-darwin-arm64@15.5.25 || 16.3.4'
  - '@next/swc-darwin-x64@15.5.25 || 16.3.4'
  - '@next/swc-linux-arm64-gnu@15.5.25 || 16.3.4'
  - '@next/swc-linux-arm64-musl@15.5.25 || 16.3.4'
  - '@next/swc-linux-x64-gnu@15.5.25 || 16.3.4'
  - '@next/swc-linux-x64-musl@15.5.25 || 16.3.4'
  - '@next/swc-win32-arm64-msvc@15.5.25 || 16.3.4'
  - '@next/swc-win32-x64-msvc@15.5.25 || 16.3.4'
  - eslint-config-next@15.5.25 || 16.3.4
  - next@15.5.25 || 16.3.4
