name: Publish packages

# Changesets-driven release, via changesets/action@v2 used as a single step -- it's "the
# equivalent of setting up the select-mode, version, and publish sub-actions" itself: on every
# push to main, it either (a) opens/updates a "Version Packages" PR if there are pending
# `.changeset/*.md` files, or (b) runs the publish script if there aren't (i.e. right after that
# PR was just merged). See CONTRIBUTING.md for the day-to-day "how do I release something" flow.
#
# The filename matters here beyond convention: npm's Trusted Publishing (OIDC) is bound to this
# exact repo + this exact workflow filename (configured once on each package's npmjs.com settings
# page) -- renaming this file would silently break publishing until that's updated to match.
#
# publish-script overrides changesets' own built-in publish mechanism (which would otherwise run
# `npm publish` per package) with scripts/publish-packages.mjs -- see that file for why: OIDC
# needs the raw `npm` CLI, but the `workspace:*` dependency between these two packages needs
# `pnpm pack` to resolve correctly first. Neither piece alone is sufficient.

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Version or Publish
        uses: changesets/action@v2
        with:
          version-script: pnpm run version-packages
          publish-script: pnpm run release
